<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>This is My page</title>
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <header>
            <img src="images/final_logo.jpeg" alt="Logo" width="150" height="130" />
            <nav class="navigationBar">
                <li><a href="index.html">Home</a></li>
                <li class="navBar-options">
                    <a href="#" class="options-btn">Options</a>
                    <div class="dropdown-content">
                        <a href="add_student.html"> Add new student</a>
                        <a href="view_Students.html"> View students</a>
                    </div>
                </li>

                <li class="navBar-account">
                    <a href="#" class="account-btn">Account</a>
                </li>
                <li><a href="contact.html"> Contact Us</a></li>
            </nav>
        </header>

        <div class="container">
            <form action="" class="form">
                <h1 class="mainTitle">Edit Student</h1>

                <div class="add_new">
                    <input disabled class="input" placeholder="ID" type="text" maxlength="8" id = "id"/>
                    <label class="label">ID</label>
                </div>

                <div class="add_new">
                    <input class="input" placeholder="Name" type="text" id = "name"/>
                    <label class="label">Name</label>
                </div>

                <div class="add_new">
                    <input class="input" placeholder="Level" type="number" min="1" max="4" value="2" id ="level"/>
                    <label class="label">Level</label>
                </div>

                <div class="add_new">
                    <select class="input" id = "status">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                    <label class="label">Status</label>
                </div>

                <div class="add_new">
                    <input class="input" placeholder="Date" type="date" id = "date"/>
                    <label class="label">Date of birth</label>
                </div>

                <div class="add_new">
                    <select class="input" disabled class = "dropdown-content" id = "de">
                        <option value="CS">Computer Science</option>
                        <option value="IS">Information System</option>
                        <option value="AI">Artificial Intelligence</option>
                        <option value="DS">Decision Support</option>
                        <option value="IT">Information Technology</option>
                    </select>
                    <label class="label">Department</label>
                </div>

                <div class="add_new">
                    <input class="input" placeholder="GPA" type="number" min="0" max="4.0" step="0.01" id = "gpa"/>
                    <label class="label">GPA</label>
                </div>

                <div class="add_new">
                    <input class="input" placeholder="Email" type="email" id = "email"/>
                    <label class="label">Email</label>
                </div>

                <div class="add_new">
                    <select class="input" id = "gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                    <label class="label">Gender</label>
                </div>

                <div class="add_new">
                    <input class="input" placeholder="Phone Number" type="text" id = "phone"/>
                    <label class="label">Phone Number</label>
                </div>

                <button type="button" class="submit" id = "save-btn">Save Changes</button>
                <button type="button" class="submit" id = "del-btn">Delete Student</button>
            </form>
        </div>

        <script src="scripts/edit-student.js"></script>
    </body>
</html>
