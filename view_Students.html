        <form action="Department.html" method="post">
            <input type="search" placeholder="Search" id="searchName" class="search"/> 
            <select class="search-option">
                <option value="0">Name</option>
                <option value="1">ID</option>
                <option value="2">Level</option>
                <option value="3">Status</option>
                <option value="4">Date of Birth</option>
                <option value="5">GPA</option>
                <option value="6">Gender</option>
                <option value="7">Email</option>
                <option value="8">Department</option>
                <option value="9">Phone Number</option>
              </select>
                      
                    <br />
            <div class="view">
                <table border="1" id = "student-table-body">
                    <caption align="" class="header_view"> <h1>All students</h1> </caption>
                    <thead>
                        <tr>

                            <th>&ensp; Name &ensp; </th>
                            <th>&ensp; ID &ensp;</th>

                            <th>&ensp; Gender &ensp;</th>

                            <th>&ensp; &ensp;</th>
