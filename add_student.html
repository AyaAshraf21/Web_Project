<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Add new student</title>
        <link rel="stylesheet" href="style.css"> 
    </head>

    <body>
        <header>
            <img src="images/logo_fci.png" alt="Logo" width="150" height="130"/>
            <nav class="navigationBar">
                <li> <a href="index.html">Home</a></li>
                <li class="navBar-options">
                    <a href="#" class="options-btn">Options</a>
                    <div class="dropdown-content">
                        <a href="#" class="active"> Add new student</a>
                        <a href="view_Students.html"> View students</a>
                    </div>
                </li>

                <li class="navBar-account">
                    <a href="#" class="account-btn">Account</a>
                </li>
                <li><a href="contact.html"> Contact Us</a></li>
            </nav>
        </header>
        

        <div class="container">
            <form id="addStudentForm" action="" class="form">
                <h1 class="mainTitle">Add New Student</h1>
                <div class="add_new">
                    <input type="text" placeholder="Name" class="input" id="name">
                    <label class="label">Name</label>
                </div>

                <div class="add_new">
                    <input type="text" placeholder="ID" class="input" id = "id">
                    <label class="label">ID</label>
                </div>

                <div class="add_new">
                    <input type="number" placeholder="Level" id="level" name="level" min="1" max="4" class="input" id="level">
                    <label for="level" class="label">Level</label>
                </div>

                <div class="add_new">
                    <select name = "Status" class="input" id = "status">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                    <label class="label">Status</label>
                </div>

                <div class="add_new">
                    <input type="date" class="input" id = "date">
                    <label class="label">Date of birth</label>
                </div>

                <div class="add_new">
                    <select name="department" class="input" id = "de">
                        <option value="CS">Computer Science</option>
                        <option value="IS">Information System</option>
                        <option value="AI">Artificial Intelligence</option>
                        <option value="DS">Decision Support</option>
                        <option value="IT">Information Technology</option>
                    </select>
                    <label class="label">Department</label>
                </div>

                <div class="add_new">
                    <input type="text" placeholder="GPA" class="input" id = "gpa">
                    <label class="label">GPA</label>
                </div>

                <div class="add_new">
                    <input type="email" placeholder="Email" class="input" id = "email">
                    <label class="label">Email</label>
                </div>

                <div class="add_new">
                    <select name="gender" class="input" id = "gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                    <label class="label">Gender</label>
                </div>

                <div class="add_new">
                    <input type="tel" id="phone" name="phone" pattern="(01)[0,1,2,5][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]" class="input" placeholder="Phone Number" id = "phone">
                    <label for="phone" class="label">Phone Number</label> 
                </div>

                <button type="submit" class="submit">Add New Student</button>

            </form>
        </div>
        <script src="scripts/dd_student.js"></script>
        
    </body>
</html>
